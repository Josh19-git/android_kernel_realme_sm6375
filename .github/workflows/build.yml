name: Build Realme SM6375 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - oscar

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip

      - name: Verify KernelSU-Next
        run: |
          set -e

          test -d KernelSU-Next/kernel
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile
          test -L drivers/kernelsu

          TARGET="$(readlink drivers/kernelsu)"

          echo "KernelSU-Next directory: OK"
          echo "drivers/kernelsu -> ${TARGET}"

          test "${TARGET}" = "../KernelSU-Next/kernel"

          echo "KernelSU-Next symlink: OK"

      - name: Verify SUSFS source
        run: |
          set -e

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          grep -q 'SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -q 'obj-\$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

          echo "SUSFS source: OK"
          echo "SUSFS version: v2.3.0"

      - name: Configure kernel
        run: |
          set -e

          make ARCH=arm64 \
            KBUILD_DEFCONFIG=vendor/holi-qgki_defconfig \
            defconfig

          make ARCH=arm64 olddefconfig

      - name: Verify KSU and SUSFS configuration
        run: |
          set -e

          configs="
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          "

          echo "===== KSU/SUSFS CONFIGURATION ====="

          while IFS= read -r config; do
            [ -z "$config" ] && continue

            if grep -qx "$config" .config; then
              echo "PASS: $config"
            else
              echo "FAIL: $config"
              exit 1
            fi
          done <<< "$configs"

      - name: Verify KernelSU manual hooks
        run: |
          set -e

          echo "===== REBOOT HOOK ====="
          grep -n -B2 -A5 "ksu_handle_sys_reboot" kernel/reboot.c

          echo
          echo "===== FACCESSAT HOOK ====="
          grep -n -B2 -A5 "ksu_handle_faccessat" fs/open.c

          grep -q "ksu_handle_sys_reboot" kernel/reboot.c
          grep -q "ksu_handle_faccessat" fs/open.c

          echo
          echo "KernelSU manual hooks: PASS"

      - name: Verify KernelSU Kbuild hook requirement
        run: |
          set -e

          HAVE_KSU_HOOK=1

          if grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            HAVE_KSU_HOOK=0
          fi

          echo "HAVE_KSU_HOOK=${HAVE_KSU_HOOK}"

          if [ "${HAVE_KSU_HOOK}" -eq 0 ]; then
            echo "KBUILD HOOK TEST: PASS"
          else
            echo "KBUILD HOOK TEST: FAIL"
            exit 1
          fi

      - name: Build kernel
        run: |
          set -e

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz \
            dtbs \
            modules

      - name: Collect build artifacts
        if: success()
        run: |
          set -e

          rm -rf artifacts
          mkdir -p artifacts

          cp arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          cp System.map artifacts/ 2>/dev/null || true
          cp Module.symvers artifacts/ 2>/dev/null || true
          cp vmlinux artifacts/ 2>/dev/null || true

          if [ -d arch/arm64/boot/dts ]; then
            find arch/arm64/boot/dts -type f \
              \( -name '*.dtb' -o -name '*.dtbo' \) \
              -exec cp --parents {} artifacts/ \;
          fi

          find . -type f -name '*.ko' \
            -not -path './artifacts/*' \
            -exec cp --parents {} artifacts/ \;

          echo "===== BUILD ARTIFACTS ====="
          find artifacts -type f -print

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: realme-sm6375-kernel
          path: artifacts/
          if-no-files-found: error
