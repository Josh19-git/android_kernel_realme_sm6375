name: Realme SM6375 Kernel - Snapdragon LLVM 10.0.9 + KSU-Next + SUSFS

on:
  workflow_dispatch:
  push:
    branches:
      - oscar

permissions:
  contents: write

jobs:
  build:
    name: Build Realme SM6375 Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/holi-qgki_defconfig
      KERNEL_NAME: Realme-SM6375-Kernel
      KSU_VERSION: KernelSU-Next Legacy
      SUSFS_VERSION: v2.3.0

      CLANG_SOURCE: "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/llvm-arm-toolchain-ship-10.0.9.tar.gz"
      GNU_SOURCE: "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"


      CUSTOM_CMDS: ""
      EXTRA_CMDS: "LLVM=1 LLVM_IAS=1"

      CLANG_DIR: ${{ github.workspace }}/clang
      GNU_DIR: ${{ github.workspace }}/gnu

      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-actions

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout oscar
        uses: actions/checkout@v4
        with:
          ref: oscar
          fetch-depth: 1
          submodules: false

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            e2fsprogs \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip \
            zstd

      # ============================================================
      # SNAPDRAGON LLVM 10.0.9
      # ============================================================

      - name: Install LLVM 10 runtime dependencies
        run: |
          set -e

          echo "===== INSTALL LLVM 10 RUNTIME ====="

          sudo apt-get update
          sudo apt-get install -y             libtinfo5             libc6-dev             build-essential

          echo
          echo "===== VERIFY LIBTINFO ====="
          ldconfig -p | grep 'libtinfo.so.5'

          test -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5

          echo "libtinfo.so.5: PASS"

      - name: Download Snapdragon LLVM 10.0.9
        run: |
          set -e

          rm -rf "$CLANG_DIR"
          mkdir -p "$CLANG_DIR"

          echo "===== CLANG SOURCE ====="
          echo "$CLANG_SOURCE"
          echo

          echo "===== DOWNLOAD CLANG ====="

          wget -q --show-progress \
            "$CLANG_SOURCE" \
            -O clang.tar.gz

          test -s clang.tar.gz

          echo
          echo "===== CLANG ARCHIVE ====="
          ls -lh clang.tar.gz

          echo
          echo "===== VERIFY CLANG ARCHIVE ====="

          file clang.tar.gz
          tar -tzf clang.tar.gz >/dev/null

          echo "Clang archive integrity: PASS"

          echo
          echo "===== EXTRACT CLANG ====="

          tar -xzf clang.tar.gz \
            -C "$CLANG_DIR"

          echo
          echo "===== LOCATE CLANG ====="

          CLANG_BIN="$(find "$CLANG_DIR" -type f -name clang -executable | head -n 1)"
          LLD_BIN="$(find "$CLANG_DIR" -type f -name ld.lld -executable | head -n 1)"

          echo "CLANG_BIN=$CLANG_BIN"
          echo "LLD_BIN=$LLD_BIN"

          test -n "$CLANG_BIN"
          test -n "$LLD_BIN"

          CLANG_BIN_DIR="$(dirname "$CLANG_BIN")"

          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"

          echo
          echo "===== CLANG VERSION ====="
          "$CLANG_BIN" --version

          echo
          echo "===== LLD VERSION ====="
          "$LLD_BIN" --version

          echo
          echo "Snapdragon LLVM 10.0.9: PASS"

          echo

      # ============================================================
      # ARM GNU TOOLCHAIN 14.2
      # ============================================================

      - name: Download ARM GNU 14.2
        run: |
          set -e

          rm -rf "$GNU_DIR"
          mkdir -p "$GNU_DIR"

          echo "===== GNU SOURCE ====="
          echo "$GNU_SOURCE"
          echo

          echo "===== DOWNLOAD ARM GNU ====="

          wget -q --show-progress             "$GNU_SOURCE"             -O arm-gnu.tar.xz

          test -s arm-gnu.tar.xz

          echo
          echo "===== GNU ARCHIVE ====="
          ls -lh arm-gnu.tar.xz

          echo
          echo "===== EXTRACT ARM GNU ====="

          tar -xJf arm-gnu.tar.xz             -C "$GNU_DIR"             --strip-components=1

          test -x "$GNU_DIR/bin/aarch64-none-linux-gnu-gcc"
          test -x "$GNU_DIR/bin/aarch64-none-linux-gnu-ld"
          test -x "$GNU_DIR/bin/aarch64-none-linux-gnu-as"
          test -x "$GNU_DIR/bin/aarch64-none-linux-gnu-ar"

          echo "$GNU_DIR/bin" >> "$GITHUB_PATH"

          echo
          echo "===== ARM GNU VERSION ====="

          "$GNU_DIR/bin/aarch64-none-linux-gnu-gcc" --version
          "$GNU_DIR/bin/aarch64-none-linux-gnu-ld" --version | head -n 1
          "$GNU_DIR/bin/aarch64-none-linux-gnu-as" --version | head -n 1

          echo
          echo "ARM GNU 14.2: PASS"

      - name: Verify KernelSU-Next
        run: |
          set -e

          test -d KernelSU-Next/kernel
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU-Next/kernel"

          echo "KernelSU-Next: OK"

      # ============================================================
      # VERIFY SUSFS
      # ============================================================

      - name: Verify SUSFS
        run: |
          set -e

          grep -q '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

          echo "SUSFS v2.3.0: OK"

      # ============================================================
      # VERIFY KSU MANUAL HOOKS
      # ============================================================

      - name: Verify KernelSU manual hooks
        run: |
          set -e

          echo "===== fs/open.c ====="
          grep -n -C 3 'ksu_handle_faccessat' fs/open.c

          echo
          echo "===== kernel/reboot.c ====="
          grep -n -C 3 'ksu_handle_sys_reboot' kernel/reboot.c

          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c

          echo "KSU manual hooks: PASS"

      - name: Verify KernelSU manual hook integration
        run: |
          set -e

          echo "===== KernelSU hook implementation ====="

          grep -n \
            'ksu_handle_faccessat' \
            KernelSU-Next/kernel/feature/sucompat.c

          grep -n \
            'ksu_handle_sys_reboot' \
            KernelSU-Next/kernel/supercall/supercall.c

          echo
          echo "===== Kernel manual hook integration ====="

          grep -n \
            'ksu_handle_faccessat' \
            fs/open.c

          grep -n \
            'ksu_handle_sys_reboot' \
            kernel/reboot.c

          test -n "$(grep -n \
            'ksu_handle_faccessat' \
            KernelSU-Next/kernel/feature/sucompat.c)"

          test -n "$(grep -n \
            'ksu_handle_sys_reboot' \
            KernelSU-Next/kernel/supercall/supercall.c)"

          test -n "$(grep -n \
            'ksu_handle_faccessat' \
            fs/open.c)"

          test -n "$(grep -n \
            'ksu_handle_sys_reboot' \
            kernel/reboot.c)"

          echo
          echo "KernelSU manual hook integration: PASS"

      # ============================================================
      # GENERATE DEFCONFIG
      # ============================================================

      - name: Generate defconfig
        run: |
          set -e

          make \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CC=clang \
            KBUILD_DEFCONFIG="$DEFCONFIG" \
            defconfig

      # ============================================================
      # OLDDEFCONFIG
      # ============================================================

      - name: Run olddefconfig
        run: |
          set -e

          make \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CC=clang \
            olddefconfig

      # ============================================================
      # VERIFY CONFIGURATION
      # ============================================================

      - name: Verify KSU and SUSFS configuration
        run: |
          set -e

          CONFIG=out/.config

          echo "===== KSU CONFIG ====="

          grep '^CONFIG_KSU=' "$CONFIG"
          grep '^CONFIG_KSU_MANUAL_HOOK=' "$CONFIG"

          echo
          echo "===== SUSFS CONFIG ====="

          grep '^CONFIG_KSU_SUSFS=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_SUS_PATH=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_SUS_MOUNT=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_SUS_KSTAT=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_SPOOF_UNAME=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_ENABLE_LOG=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=' "$CONFIG"
          grep '^CONFIG_KSU_SUSFS_SUS_MAP=' "$CONFIG"

          required_configs="
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          "

          for config in $required_configs; do
            if ! grep -qx "$config" "$CONFIG"; then
              echo "ERROR: Missing configuration: $config"
              exit 1
            fi
          done

          echo
          echo "KSU/SUSFS CONFIGURATION: PASS"

      # ============================================================
      # BUILD IMAGE + DTBS
      # ============================================================

      - name: Build Image and DTBs
        run: |
          set -e

          make \
            -j"$(nproc)" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image \
            dtbs

      # ============================================================
      # VERIFY IMAGE
      # ============================================================

      - name: Verify uncompressed Image
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo "===== IMAGE ====="
          ls -lh "$IMAGE"
          file "$IMAGE"

          if [ -f out/arch/arm64/boot/Image-dtb.gz ]; then
            echo "ERROR: Image-dtb.gz was generated."
            exit 1
          fi

          if [ -f out/arch/arm64/boot/Image-dtb ]; then
            echo "ERROR: Image-dtb was generated."
            exit 1
          fi

          echo "Uncompressed Image: PASS"

      # ============================================================
      # LOCATE DTB
      # ============================================================

      - name: Locate DTB
        run: |
          set -e

          mkdir -p artifacts

          DTB="out/arch/arm64/boot/dts/vendor/oscar/holi-oscar.dtb"

          echo "Checking target DTB:"
          echo "$DTB"

          if [ ! -f "$DTB" ]; then
            echo "ERROR: Target Oscar DTB was not generated."
            exit 1
          fi

          cp "$DTB" artifacts/dtb

          echo
          echo "Selected DTB:"
          ls -lh artifacts/dtb

      # ============================================================
      # DTBO
      # ============================================================

      - name: Build or locate dtbo.img
        run: |
          set -e

          mkdir -p artifacts

          DTBO_DIR="out/arch/arm64/boot/dts/vendor/oscar"
          DTBO_IMG="artifacts/dtbo.img"

          if [ -f out/arch/arm64/boot/dtbo.img ]; then

            echo "Using out/arch/arm64/boot/dtbo.img"

            cp \
              out/arch/arm64/boot/dtbo.img \
              "$DTBO_IMG"

          elif [ -f arch/arm64/boot/dtbo.img ]; then

            echo "Using arch/arm64/boot/dtbo.img"

            cp \
              arch/arm64/boot/dtbo.img \
              "$DTBO_IMG"

          else

            echo "No prebuilt dtbo.img found."
            echo "Building Oscar dtbo.img from generated DTBO files."

            echo
            echo "===== OSCAR DTBO FILES ====="

            DTBO_FILES=(
              "holi-oscar-21707-overlay.dtbo"
              "holi-oscar-21708-overlay.dtbo"
              "holi-oscar-21629-overlay.dtbo"
              "holi-oscar-2162B-overlay.dtbo"
              "holi-oscar-216E9-overlay.dtbo"
              "holi-oscar-216EA-overlay.dtbo"
              "holi-oscar-21141-21341-overlay-EVT.dtbo"
              "holi-oscar-21141-21341-overlay-DVT.dtbo"
              "holi-oscar-21141-21341-overlay-PVT-EU.dtbo"
              "holi-oscar-21141-21341-overlay-PVT.dtbo"
              "holi-oscar-21141-overlay-MP67w.dtbo"
            )

            DTBO_INPUTS=()

            for dtbo in "${DTBO_FILES[@]}"; do
              file="${DTBO_DIR}/${dtbo}"

              if [ ! -f "$file" ]; then
                echo "ERROR: Missing Oscar DTBO:"
                echo "$file"
                exit 1
              fi

              echo "FOUND: $file"
              DTBO_INPUTS+=("$file")
            done

            echo
            echo "All Oscar DTBO files found."

            echo
            echo "===== GET mkdtboimg.py ====="

            wget -q \
              "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" \
              -O mkdtboimg.b64

            base64 -d mkdtboimg.b64 > mkdtboimg.py
            chmod +x mkdtboimg.py

            python3 mkdtboimg.py --help >/dev/null

            echo "mkdtboimg.py: PASS"

            echo
            echo "===== CREATE DTBO.IMG ====="

            python3 mkdtboimg.py create \
              --page_size=4096 \
              "$DTBO_IMG" \
              "${DTBO_INPUTS[@]}"

          fi

          test -s "$DTBO_IMG"

          echo
          echo "===== DTBO ====="
          ls -lh "$DTBO_IMG"
          file "$DTBO_IMG"

          echo
          echo "DTBO image successfully created."

      # ============================================================
      # BUILD KERNEL MODULES
      # ============================================================

      - name: Build kernel modules
        run: |
          set -e

          make \
            -j"$(nproc)" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            modules

          rm -rf "$GITHUB_WORKSPACE/modules"

          make \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CLANG_TRIPLE=aarch64-none-linux-gnu- \
            CC=clang \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules" \
            modules_install

          echo
          echo "===== INSTALLED MODULES ====="

          find "$GITHUB_WORKSPACE/modules" \
            -type f \
            -name '*.ko' \
            -print

      # ============================================================
      # BUILD vendor_dlkm.img
      #
      # This creates an ext4 image containing the modules installed
      # by modules_install.
      # ============================================================

      - name: Build vendor_dlkm.img
        run: |
          set -e

          MODULE_ROOT="$GITHUB_WORKSPACE/modules"
          VENDOR_DLKM_ROOT="$GITHUB_WORKSPACE/vendor_dlkm"
          VENDOR_DLKM_IMG="$GITHUB_WORKSPACE/artifacts/vendor_dlkm.img"

          rm -rf "$VENDOR_DLKM_ROOT"
          rm -f "$VENDOR_DLKM_IMG"

          mkdir -p \
            "$VENDOR_DLKM_ROOT/lib/modules" \
            "$GITHUB_WORKSPACE/artifacts"

          echo "===== MODULE TREE ====="

          find "$MODULE_ROOT" \
            -type f \
            -name '*.ko' \
            -print

          KO_COUNT="$(find "$MODULE_ROOT" -type f -name '*.ko' | wc -l)"

          if [ "$KO_COUNT" -eq 0 ]; then
            echo "ERROR: No kernel modules were produced."
            exit 1
          fi

          echo
          echo "Kernel modules found: $KO_COUNT"

          if [ -d "$MODULE_ROOT/lib/modules" ]; then
            cp -a \
              "$MODULE_ROOT/lib/modules/." \
              "$VENDOR_DLKM_ROOT/lib/modules/"
          fi

          echo
          echo "===== MODULE IMAGE CONTENT ====="

          find "$VENDOR_DLKM_ROOT" \
            -type f \
            -print

          MODULE_BYTES="$(du -sb "$VENDOR_DLKM_ROOT" | awk '{print $1}')"

          echo
          echo "Module tree size: $MODULE_BYTES bytes"

          # Add filesystem overhead and growth room.
          IMAGE_BYTES=$((MODULE_BYTES + 33554432))

          # Round up to 4 MiB.
          IMAGE_BYTES=$(( (IMAGE_BYTES + 4194303) / 4194304 * 4194304 ))

          # Minimum 32 MiB.
          if [ "$IMAGE_BYTES" -lt 33554432 ]; then
            IMAGE_BYTES=33554432
          fi

          echo "vendor_dlkm image size: $IMAGE_BYTES bytes"

          echo
          echo "===== CREATE vendor_dlkm.img ====="

          truncate \
            -s "$IMAGE_BYTES" \
            "$VENDOR_DLKM_IMG"

          mkfs.ext4 \
            -F \
            -m 0 \
            -L vendor_dlkm \
            "$VENDOR_DLKM_IMG"

          echo
          echo "===== MOUNT vendor_dlkm.img ====="

          MOUNT_POINT="$GITHUB_WORKSPACE/vendor_dlkm_mount"

          sudo rm -rf "$MOUNT_POINT"
          sudo mkdir -p "$MOUNT_POINT"

          sudo mount \
            -o loop \
            "$VENDOR_DLKM_IMG" \
            "$MOUNT_POINT"

          echo
          echo "===== COPY MODULES ====="

          sudo cp -a \
            "$VENDOR_DLKM_ROOT/." \
            "$MOUNT_POINT/"

          sync

          sudo umount "$MOUNT_POINT"
          sudo rm -rf "$MOUNT_POINT"

          echo
          echo "===== CHECK vendor_dlkm.img ====="

          e2fsck \
            -fy \
            "$VENDOR_DLKM_IMG"

          test -s "$VENDOR_DLKM_IMG"

          echo
          echo "===== vendor_dlkm.img ====="

          ls -lh "$VENDOR_DLKM_IMG"
          file "$VENDOR_DLKM_IMG"

          echo
          echo "vendor_dlkm.img: PASS"

      # ============================================================
      # VERIFY RAW FILES
      # ============================================================

      - name: Verify raw kernel files
        run: |
          set -e

          test -s artifacts/Image
          test -s artifacts/dtb
          test -s artifacts/dtbo.img
          test -s artifacts/vendor_dlkm.img

          echo "===== RAW ARTIFACTS ====="

          ls -lh \
            artifacts/Image \
            artifacts/dtb \
            artifacts/dtbo.img \
            artifacts/vendor_dlkm.img

      # ============================================================
      # CLONE ANYKERNEL3
      # ============================================================

      - name: Clone osm0sis AnyKernel3
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          test -f AnyKernel3/tools/ak3-core.sh
          test -f AnyKernel3/META-INF/com/google/android/update-binary

          echo "osm0sis AnyKernel3: PASS"

      # ============================================================
      # PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        run: |
          set -e

          cd AnyKernel3

          rm -f \
            Image \
            Image.gz \
            Image-dtb \
            Image-dtb.gz \
            dtb \
            dtbo \
            dtbo.img \
            vendor_dlkm.img

          rm -rf \
            ramdisk \
            patch \
            modules

          cp ../artifacts/Image Image
          cp ../artifacts/dtb dtb
          cp ../artifacts/dtbo.img dtbo.img
          cp ../artifacts/vendor_dlkm.img vendor_dlkm.img

          test -s Image
          test -s dtb
          test -s dtbo.img
          test -s vendor_dlkm.img

          if find . -maxdepth 1 -type f \
              \( \
                -name 'Image-dtb' \
                -o -name 'Image-dtb.gz' \
              \); then
            echo "ERROR: Image-dtb detected."
            exit 1
          fi

          echo "===== ANYKERNEL3 FILES ====="

          ls -lh \
            Image \
            dtb \
            dtbo.img \
            vendor_dlkm.img

          cd ..

      # ============================================================
      # ANYKERNEL3 INSTALLER
      # ============================================================

      - name: Configure AnyKernel3 installer
        run: |
          set -e

          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          # AnyKernel3 installer
          # Realme SM6375
          # KernelSU-Next Legacy + SUSFS v2.3.0

          properties() { '
          kernel.string=Realme SM6375 Kernel - KernelSU-Next Legacy + SUSFS v2.3.0
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot

          write_boot

          # Flash vendor_dlkm image when the device exposes the
          # expected by-name partition.
          VENDOR_DLKM_BLOCK="/dev/block/by-name/vendor_dlkm"

          if [ -e "$VENDOR_DLKM_BLOCK" ]; then
            ui_print " "
            ui_print "Flashing vendor_dlkm.img..."
            write_raw_image vendor_dlkm.img "$VENDOR_DLKM_BLOCK"
            ui_print "vendor_dlkm: flashed"
          else
            ui_print " "
            ui_print "WARNING: vendor_dlkm partition not found."
            ui_print "vendor_dlkm.img kept in ZIP but not flashed."
          fi
          AK3EOF

          chmod 755 AnyKernel3/anykernel.sh

          test -x AnyKernel3/anykernel.sh

          echo "AnyKernel3 installer configured."

      # ============================================================
      # VERIFY ANYKERNEL3 CONTENT
      # ============================================================

      - name: Verify AnyKernel3 package content
        run: |
          set -e

          test -f AnyKernel3/Image
          test -f AnyKernel3/dtb
          test -f AnyKernel3/dtbo.img
          test -f AnyKernel3/vendor_dlkm.img

          if [ -f AnyKernel3/Image.gz ]; then
            echo "ERROR: Image.gz exists in AnyKernel3."
            exit 1
          fi

          if [ -f AnyKernel3/Image-dtb.gz ]; then
            echo "ERROR: Image-dtb.gz exists in AnyKernel3."
            exit 1
          fi

          if [ -f AnyKernel3/Image-dtb ]; then
            echo "ERROR: Image-dtb exists in AnyKernel3."
            exit 1
          fi

          echo "AnyKernel3 contents: PASS"

      # ============================================================
      # CREATE FLASHABLE ZIP
      # ============================================================

      - name: Create AnyKernel3 flashable ZIP
        run: |
          set -e

          cd AnyKernel3

          zip -r9 \
            ../AnyKernel3-Realme-SM6375.zip \
            . \
            -x '.git/*' \
            -x '*.zip' \
            -x 'README.md' \
            -x '*placeholder*'

          cd ..

          test -s AnyKernel3-Realme-SM6375.zip

          echo "===== ANYKERNEL3 ZIP ====="
          ls -lh AnyKernel3-Realme-SM6375.zip

      # ============================================================
      # VALIDATE FINAL ZIP
      # ============================================================

      - name: Validate final AnyKernel3 ZIP
        run: |
          set -e

          ZIP="AnyKernel3-Realme-SM6375.zip"

          echo "===== ZIP CONTENT ====="

          unzip -l "$ZIP"

          unzip -l "$ZIP" | grep -Eq \
            '(^|[[:space:]])Image$'

          unzip -l "$ZIP" | grep -Eq \
            '(^|[[:space:]])dtb$'

          unzip -l "$ZIP" | grep -Eq \
            '(^|[[:space:]])dtbo\.img$'

          unzip -l "$ZIP" | grep -Eq \
            '(^|[[:space:]])vendor_dlkm\.img$'

          if unzip -l "$ZIP" | grep -Eq \
              'Image-dtb(\.gz)?'; then
            echo "ERROR: Image-dtb found in final ZIP."
            exit 1
          fi

          if unzip -l "$ZIP" | grep -Eq \
              '(^|[[:space:]])Image\.gz$'; then
            echo "ERROR: Image.gz found in final ZIP."
            exit 1
          fi

          echo
          echo "=========================================="
          echo " ANYKERNEL3 PACKAGE VALIDATION: PASS"
          echo "=========================================="

      # ============================================================
      # BUILD INFO
      # ============================================================

      - name: Generate build information
        run: |
          set -e

          {
            echo "Kernel: Realme SM6375"
            echo "Branch: oscar"
            echo "Compiler: Snapdragon LLVM 10.0.9"
            echo "Clang source: $CLANG_SOURCE"
            echo "CUSTOM_CMDS: $CUSTOM_CMDS"
            echo "EXTRA_CMDS: $EXTRA_CMDS"
            echo "KernelSU: KernelSU-Next Legacy"
            echo "SUSFS: v2.3.0"
            echo "Defconfig: vendor/holi-qgki_defconfig"
            echo
            echo "Kernel files:"
            ls -lh artifacts/Image
            ls -lh artifacts/dtb
            ls -lh artifacts/dtbo.img
            ls -lh artifacts/vendor_dlkm.img
            echo
            echo "AnyKernel3:"
            ls -lh AnyKernel3-Realme-SM6375.zip
          } > artifacts/build-info.txt

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Realme-SM6375-Kernel
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/Image
            artifacts/dtb
            artifacts/dtbo.img
            artifacts/vendor_dlkm.img
            artifacts/build-info.txt
            AnyKernel3-Realme-SM6375.zip
